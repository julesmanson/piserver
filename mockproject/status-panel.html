<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PiServer Status</title>
    <style>
        :root {
            --bg:     #0d1117;
            --panel:  #161b22;
            --border: #30363d;
            --text:   #e6edf3;
            --dim:    #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 24px 16px;
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .title {
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 0.1em;
            text-align: center;
        }

        /* ── LED indicators ── */
        .indicators {
            display: flex;
            justify-content: space-around;
        }

        .indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .led {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 36%, #374151, #111827);
            box-shadow: none;
            transition: background 0.25s, box-shadow 0.25s;
        }

        .led.blue {
            background: radial-gradient(circle at 38% 36%, #dbeafe, #2563eb);
            box-shadow: 0 0 10px 4px rgba(37, 99, 235, 0.65),
                        inset 0 0 4px rgba(255,255,255,0.2);
        }

        .led.green {
            background: radial-gradient(circle at 38% 36%, #dcfce7, #16a34a);
            box-shadow: 0 0 10px 4px rgba(22, 163, 74, 0.65),
                        inset 0 0 4px rgba(255,255,255,0.2);
        }

        .led.red {
            background: radial-gradient(circle at 38% 36%, #fee2e2, #dc2626);
            box-shadow: 0 0 10px 4px rgba(220, 38, 38, 0.65),
                        inset 0 0 4px rgba(255,255,255,0.2);
        }

        .led-label {
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 0.1em;
        }

        /* ── Buttons ── */
        .indicator button {
            background: var(--bg);
            color: var(--dim);
            border: 1px solid var(--border);
            padding: 3px 14px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .indicator button:hover:not(:disabled) {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        .indicator button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* ── LCD display ── */
        .lcd-wrap {
            background: #050d05;
            border: 1px solid #193019;
            border-radius: 4px;
            padding: 7px 10px;
            box-shadow: inset 0 0 12px rgba(0, 180, 0, 0.07);
        }

        .lcd {
            font-family: "Courier New", Courier, monospace;
            font-size: 11px;
            color: #39ff14;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 6px rgba(57, 255, 20, 0.5);
        }

        .lcd.offline {
            color: #1d4a1d;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title">PISERVER STATUS</div>

        <div class="indicators">
            <div class="indicator">
                <div class="led" id="led-python"></div>
                <div class="led-label">PYTHON</div>
                <button id="btn-python" disabled>—</button>
            </div>
            <div class="indicator">
                <div class="led" id="led-server"></div>
                <div class="led-label">SERVER</div>
                <button id="btn-server" disabled>—</button>
            </div>
        </div>

        <div class="lcd-wrap">
            <div class="lcd offline" id="lcd">checking...</div>
        </div>
    </div>

    <script>
    const ledPython = document.getElementById('led-python');
    const ledServer = document.getElementById('led-server');
    const btnPython = document.getElementById('btn-python');
    const btnServer = document.getElementById('btn-server');
    const lcd       = document.getElementById('lcd');

    let isRunning = false;

    function setState(on) {
        isRunning = on;
        if (on) {
            ledPython.className = 'led blue';
            ledServer.className = 'led green';
            btnPython.textContent = 'Stop';
            btnServer.textContent = 'Stop';
            btnPython.disabled = false;
            btnServer.disabled = false;
            lcd.className = 'lcd';
            lcd.textContent = 'http://localhost:8000/';
        } else {
            ledPython.className = 'led red';
            ledServer.className = 'led red';
            btnPython.textContent = 'Start';
            btnServer.textContent = 'Start';
            btnPython.disabled = false;
            btnServer.disabled = false;
            lcd.className = 'lcd offline';
            lcd.textContent = 'Server offline';
        }
    }

    async function poll() {
        try {
            const r = await fetch('/', { signal: AbortSignal.timeout(2000) });
            setState(r.ok);
        } catch (_) {
            setState(false);
        }
    }

    async function stopServer() {
        btnPython.disabled = true;
        btnServer.disabled = true;
        lcd.className = 'lcd offline';
        lcd.textContent = 'Shutting down...';
        try {
            await fetch('/shutdown', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: '{}'
            });
        } catch (_) {}
        setTimeout(poll, 900);
    }

    function handleBtn() {
        if (isRunning) {
            stopServer();
        } else {
            lcd.className = 'lcd offline';
            lcd.textContent = 'Run piserver.py to start';
        }
    }

    btnPython.addEventListener('click', handleBtn);
    btnServer.addEventListener('click', handleBtn);

    poll();
    setInterval(poll, 3000);
    </script>
</body>
</html>
